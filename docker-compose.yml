# Single service: the API also serves the static frontend (app/frontend) at "/".
# Data and trained checkpoints are NOT baked into the image - generate them first
# (see docs/setup.md) and they are mounted read-only below.
services:
  equipath:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models/checkpoints:/app/models/checkpoints:ro
